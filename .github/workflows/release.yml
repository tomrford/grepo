name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  validate-release:
    name: Validate release
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.metadata.outputs.version }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: refs/tags/${{ github.event.release.tag_name }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c

      - name: Validate release tag
        id: release
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          TAG="$RELEASE_TAG"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must match vX.Y.Z, got $TAG." >&2
            exit 1
          fi

          git fetch --force origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/tags/${TAG}:refs/tags/${TAG}"

          TAG_COMMIT="$(git rev-parse "refs/tags/${TAG}^{commit}")"
          CHECKOUT_COMMIT="$(git rev-parse HEAD)"
          if [[ "$CHECKOUT_COMMIT" != "$TAG_COMMIT" ]]; then
            echo "Checked out $CHECKOUT_COMMIT, but release tag $TAG resolves to $TAG_COMMIT." >&2
            exit 1
          fi

          if ! git merge-base --is-ancestor "$TAG_COMMIT" origin/main; then
            echo "Release tag $TAG ($TAG_COMMIT) must be reachable from origin/main." >&2
            exit 1
          fi

          echo "tag_name=$TAG" >> "$GITHUB_OUTPUT"

      - name: Validate version metadata
        id: metadata
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          TAG="$RELEASE_TAG"
          VERSION="${TAG#v}"
          CRATE_VERSION="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "grepo") | .version')"
          if [[ "$CRATE_VERSION" != "$VERSION" ]]; then
            echo "Tag $TAG must match grepo $CRATE_VERSION." >&2
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  build-artifacts:
    needs: validate-release
    permissions:
      contents: read
    uses: ./.github/workflows/release-build.yml
    with:
      ref: refs/tags/${{ needs.validate-release.outputs.tag_name }}

  publish-release-assets:
    name: Publish release assets
    runs-on: ubuntu-latest
    needs: [validate-release, build-artifacts]
    permissions:
      contents: write

    steps:
      - name: Download CLI distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: cli-dist-*
          path: dist
          merge-multiple: true

      - name: Publish release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.validate-release.outputs.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/* --clobber

  publish-crate:
    name: Publish crate
    runs-on: ubuntu-latest
    needs: [validate-release, build-artifacts, publish-release-assets]
    environment: crates
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: refs/tags/${{ needs.validate-release.outputs.tag_name }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c

      - name: Check publish status
        id: publish_status
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.validate-release.outputs.version }}
        run: |
          if curl -fsSL -H "User-Agent: grepo-release-workflow" "https://crates.io/api/v1/crates/grepo/${RELEASE_VERSION}" >/dev/null; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "grepo ${RELEASE_VERSION} is already published."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check crate package
        if: steps.publish_status.outputs.published != 'true'
        run: cargo publish --locked --dry-run

      - name: Authenticate with crates.io
        if: steps.publish_status.outputs.published != 'true'
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18

      - name: Publish crate
        if: steps.publish_status.outputs.published != 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked
