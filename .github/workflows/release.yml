name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

env:
  CICD_INTERMEDIATES_DIR: "_cicd-intermediates"

jobs:
  validate-release:
    name: Validate release
    runs-on: ubuntu-latest
    if: ${{ !github.event.release.prerelease }}
    outputs:
      tag_name: ${{ steps.validate.outputs.tag_name }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Validate release tag
        id: validate
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          TAG="$RELEASE_TAG"
          VERSION="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          EXPECTED_TAG="v${VERSION}"

          if [[ "$TAG" != "$EXPECTED_TAG" ]]; then
            echo "Release tag ${TAG} does not match Cargo.toml version ${VERSION}; expected ${EXPECTED_TAG}." >&2
            exit 1
          fi

          git fetch --force origin "+refs/heads/main:refs/remotes/origin/main" "+refs/tags/${TAG}:refs/tags/${TAG}"
          TAG_COMMIT="$(git rev-parse "${TAG}^{commit}")"
          if ! git merge-base --is-ancestor "$TAG_COMMIT" origin/main; then
            echo "Release tag ${TAG} points at ${TAG_COMMIT}, which is not reachable from origin/main." >&2
            exit 1
          fi

          echo "tag_name=$TAG" >> "$GITHUB_OUTPUT"

  check-release:
    name: Check release
    runs-on: ubuntu-latest
    needs: validate-release
    steps:
      - name: Checkout source code
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.validate-release.outputs.tag_name }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Test git integrations
        run: cargo test --locked --features git-integration-tests

      - name: Check package
        run: cargo publish --locked --dry-run

  build-release:
    name: ${{ matrix.job.target }} (${{ matrix.job.os }})
    runs-on: ${{ matrix.job.os }}
    needs: [validate-release, check-release]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        job:
          - {
              target: x86_64-unknown-linux-musl,
              os: ubuntu-latest,
              use-cross: true,
            }
          - {
              target: aarch64-unknown-linux-musl,
              os: ubuntu-latest,
              use-cross: true,
            }
          - { target: x86_64-apple-darwin, os: macos-15-intel }
          - { target: aarch64-apple-darwin, os: macos-latest }

    env:
      BUILD_CMD: cargo

    steps:
      - name: Checkout source code
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.validate-release.outputs.tag_name }}

      - name: Extract crate metadata
        shell: bash
        run: |
          echo "PROJECT_NAME=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].targets[] | select(.kind[] == "bin") | .name')" >> "$GITHUB_ENV"
          echo "PROJECT_VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.job.target }}

      - name: Install cross
        if: matrix.job.use-cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Overwrite build command
        if: matrix.job.use-cross
        shell: bash
        run: echo "BUILD_CMD=cross" >> "$GITHUB_ENV"

      - name: Build
        shell: bash
        run: $BUILD_CMD build --locked --release --target=${{ matrix.job.target }}

      - name: Build archive
        shell: bash
        run: |
          BIN_NAME="${PROJECT_NAME}"
          BIN_PATH="target/${{ matrix.job.target }}/release/${BIN_NAME}"

          PKG_BASENAME="${PROJECT_NAME}-v${PROJECT_VERSION}-${{ matrix.job.target }}"
          PKG_NAME="${PKG_BASENAME}.tar.gz"

          PKG_STAGING="${CICD_INTERMEDIATES_DIR}/package"
          ARCHIVE_DIR="${PKG_STAGING}/${PKG_BASENAME}/"
          mkdir -p "${ARCHIVE_DIR}"

          cp "${BIN_PATH}" "${ARCHIVE_DIR}"
          cp README.md LICENSE* "${ARCHIVE_DIR}" 2>/dev/null || true

          pushd "${PKG_STAGING}/" >/dev/null
          tar czf "${PKG_NAME}" "${PKG_BASENAME}"/*
          shasum -a 256 "${PKG_NAME}" > "${PKG_NAME}.sha256"
          popd >/dev/null

          echo "PKG_PATH=${PKG_STAGING}/${PKG_NAME}" >> "$GITHUB_ENV"
          echo "PKG_CHECKSUM=${PKG_STAGING}/${PKG_NAME}.sha256" >> "$GITHUB_ENV"

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.validate-release.outputs.tag_name }}"
          gh release upload "$TAG" "${{ env.PKG_PATH }}" "${{ env.PKG_CHECKSUM }}" --clobber

  publish-crate:
    name: Publish crate
    runs-on: ubuntu-latest
    needs: [validate-release, build-release]
    environment: crates
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout source code
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.validate-release.outputs.tag_name }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Extract crate metadata
        id: metadata
        shell: bash
        run: |
          echo "name=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].name')" >> "$GITHUB_OUTPUT"
          echo "version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')" >> "$GITHUB_OUTPUT"

      - name: Check publish status
        id: publish_status
        shell: bash
        run: |
          CRATE="${{ steps.metadata.outputs.name }}"
          VERSION="${{ steps.metadata.outputs.version }}"
          if curl -fsSL -H "User-Agent: grepo-release-workflow" "https://crates.io/api/v1/crates/${CRATE}/${VERSION}" >/dev/null; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "${CRATE} ${VERSION} is already published."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check package
        if: steps.publish_status.outputs.published != 'true'
        run: cargo publish --locked --dry-run

      - name: Authenticate with crates.io
        if: steps.publish_status.outputs.published != 'true'
        id: auth
        uses: rust-lang/crates-io-auth-action@v1.0.4

      - name: Publish to crates.io
        if: steps.publish_status.outputs.published != 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked
