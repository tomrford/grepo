name: Release dry run

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit to rehearse
        required: true
        default: main
        type: string
      tag:
        description: Release tag whose version metadata should be validated
        required: true
        default: v0.2.0
        type: string

permissions:
  contents: read

jobs:
  validate:
    name: Validate release candidate
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.source.outputs.commit }}
      version: ${{ steps.metadata.outputs.version }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c

      - name: Validate source ref
        id: source
        shell: bash
        run: |
          git fetch --force origin "+refs/heads/main:refs/remotes/origin/main"
          COMMIT="$(git rev-parse 'HEAD^{commit}')"
          if ! git merge-base --is-ancestor "$COMMIT" origin/main; then
            echo "Release candidate $COMMIT must be reachable from origin/main." >&2
            exit 1
          fi
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"

      - name: Validate version metadata
        id: metadata
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          TAG="$RELEASE_TAG"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must match vX.Y.Z, got $TAG." >&2
            exit 1
          fi

          VERSION="${TAG#v}"
          CRATE_VERSION="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "grepo") | .version')"
          if [[ "$CRATE_VERSION" != "$VERSION" ]]; then
            echo "Tag $TAG must match grepo $CRATE_VERSION." >&2
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  build-artifacts:
    needs: validate
    permissions:
      contents: read
    uses: ./.github/workflows/release-build.yml
    with:
      ref: ${{ needs.validate.outputs.commit }}

  check-crate:
    name: Check crate package
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.validate.outputs.commit }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c

      - name: Check crate package
        run: cargo publish --locked --dry-run

      - name: Package crate archive
        run: cargo package --locked --no-verify

      - name: Inspect crate contents
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: tar -tzf "target/package/grepo-${RELEASE_VERSION}.crate"

      - name: Upload crate package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: crate-dist
          path: target/package/*.crate
          if-no-files-found: error

  summarize:
    name: Summarize release artifacts
    runs-on: ubuntu-latest
    needs: [validate, build-artifacts, check-crate]

    steps:
      - name: Download CLI distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: cli-dist-*
          path: dist
          merge-multiple: true

      - name: Download crate package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: crate-dist
          path: dist

      - name: Create artifact manifest
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          SOURCE_COMMIT: ${{ needs.validate.outputs.commit }}
        run: |
          find dist -maxdepth 1 -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          {
            echo "## Release dry run"
            echo
            echo "Version: \`${RELEASE_VERSION}\`"
            echo
            echo "Commit: \`${SOURCE_COMMIT}\`"
            echo
            echo "### Artifacts"
            echo
            while IFS= read -r path; do
              echo "- \`$(basename "$path")\`"
            done < <(find dist -maxdepth 1 -type f | sort)
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifact manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-dry-run-manifest
          path: SHA256SUMS
          if-no-files-found: error
